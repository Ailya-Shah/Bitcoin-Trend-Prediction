<svg width="680" height="1000" viewBox="0 0 680 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bitcoin prediction project architecture diagram" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Architecture diagram</title>
  <desc>Pipeline from Binance API and Blockchain API through data cleaning, EDA, statistical analysis, feature engineering, ML/deep learning benchmark, backtesting, dashboard JSON, to React dashboard.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="680" height="1000" fill="#ffffff"/>

  <style>
    .box { fill: #f7f7f7; stroke: #1a1a1a; stroke-width: 1.2; }
    .label { fill: #1a1a1a; font-size: 14px; font-weight: 600; }
    .sub { fill: #555555; font-size: 11.5px; }
    .line { stroke: #1a1a1a; stroke-width: 1.2; fill: none; }
  </style>

  <!-- Data sources -->
  <rect class="box" x="80" y="20" width="220" height="56" rx="8"/>
  <text class="label" x="190" y="44" text-anchor="middle">Binance API</text>
  <text class="sub" x="190" y="62" text-anchor="middle">Price and volume data</text>

  <rect class="box" x="380" y="20" width="220" height="56" rx="8"/>
  <text class="label" x="490" y="44" text-anchor="middle">Blockchain API</text>
  <text class="sub" x="490" y="62" text-anchor="middle">On-chain activity data</text>

  <!-- Converge -->
  <path class="line" d="M190 76 L190 100 L340 100 L340 120" marker-end="url(#arrow)"/>
  <path class="line" d="M490 76 L490 100 L340 100"/>

  <!-- Pipeline stages -->
  <rect class="box" x="230" y="120" width="220" height="44" rx="8"/>
  <text class="label" x="340" y="147" text-anchor="middle">Data cleaning</text>

  <line class="line" x1="340" y1="164" x2="340" y2="200" marker-end="url(#arrow)"/>

  <rect class="box" x="230" y="200" width="220" height="44" rx="8"/>
  <text class="label" x="340" y="227" text-anchor="middle">Exploratory data analysis</text>

  <line class="line" x1="340" y1="244" x2="340" y2="280" marker-end="url(#arrow)"/>

  <rect class="box" x="230" y="280" width="220" height="44" rx="8"/>
  <text class="label" x="340" y="307" text-anchor="middle">Statistical analysis</text>

  <line class="line" x1="340" y1="324" x2="340" y2="360" marker-end="url(#arrow)"/>

  <rect class="box" x="230" y="360" width="220" height="44" rx="8"/>
  <text class="label" x="340" y="387" text-anchor="middle">Feature engineering</text>

  <line class="line" x1="340" y1="404" x2="340" y2="440" marker-end="url(#arrow)"/>

  <rect class="box" x="200" y="440" width="280" height="56" rx="8"/>
  <text class="label" x="340" y="465" text-anchor="middle">ML and deep learning</text>
  <text class="sub" x="340" y="483" text-anchor="middle">Tree models plus MLP benchmark</text>

  <line class="line" x1="340" y1="496" x2="340" y2="532" marker-end="url(#arrow)"/>

  <rect class="box" x="230" y="532" width="220" height="44" rx="8"/>
  <text class="label" x="340" y="559" text-anchor="middle">Backtesting</text>

  <line class="line" x1="340" y1="576" x2="340" y2="612" marker-end="url(#arrow)"/>

  <rect class="box" x="230" y="612" width="220" height="44" rx="8"/>
  <text class="label" x="340" y="639" text-anchor="middle">Dashboard JSON</text>

  <line class="line" x1="340" y1="656" x2="340" y2="692" marker-end="url(#arrow)"/>

  <rect class="box" x="230" y="692" width="220" height="44" rx="8"/>
  <text class="label" x="340" y="719" text-anchor="middle">React dashboard</text>
</svg>
